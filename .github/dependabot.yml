version: 2
updates:

  # Maintain dependencies for Composer
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "php"
      - "automerge"

  # Maintain dependencies for NPM
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "npm"
      - "automerge"
    ignore:
      # vue-loader 16+ is Vue 3 only; this module is on Vue 2.7
      - dependency-name: "vue-loader"
        update-types: ["version-update:semver-major"]
      # Stay on Vue 2 until an intentional migration
      - dependency-name: "vue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vue-template-compiler"
        update-types: ["version-update:semver-major"]
